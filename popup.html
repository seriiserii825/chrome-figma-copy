<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Figma Copy — Page Order</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    width: 360px;
    margin: 0;
    padding: 14px;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1a1a1a;
    background: #fff;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 10px;
  }
  .field { margin-bottom: 10px; }
  label {
    display: block;
    font-size: 11px;
    color: #666;
    margin-bottom: 4px;
  }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 12px;
  }
  .row { display: flex; gap: 6px; }
  .row input { flex: 1; }
  button {
    padding: 7px 10px;
    border: none;
    border-radius: 6px;
    background: #f24e1e;
    color: #fff;
    font-size: 12px;
    cursor: pointer;
  }
  button.secondary {
    background: #f0f0f0;
    color: #1a1a1a;
  }
  button:disabled { opacity: .5; cursor: default; }
  #runBtn { width: 100%; margin-top: 4px; padding: 9px; font-size: 13px; }
  #status {
    margin-top: 10px;
    font-size: 11px;
    color: #666;
    min-height: 14px;
    white-space: pre-wrap;
  }
  #status.error { color: #d1242f; }
  textarea {
    width: 100%;
    height: 160px;
    margin-top: 8px;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font: 12px/1.4 ui-monospace, monospace;
    resize: vertical;
  }
  .conv label { color: #1a1a1a; font-size: 12px; margin-bottom: 6px; }
  .conv label.inline { display: inline-flex; gap: 6px; align-items: center; margin: 6px 0 0; }
  .proj-current { background: #fff4f0; border: 1px solid #f7c2b0; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .proj-label { font-size: 11px; color: #a4553a; }
  .proj-name-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
  .proj-name { font-size: 15px; font-weight: 700; color: #1a1a1a; word-break: break-all; }
  #scssProjectClear { padding: 4px 8px; font-size: 11px; white-space: nowrap; }
  .proj-list { max-height: 170px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; margin-top: 4px; }
  .proj-list button { display: block; width: 100%; text-align: left; background: none; color: #1a1a1a; padding: 5px 8px; border-radius: 0; }
  .proj-list button.active { background: #fde9e3; }
  .proj-list button.current { font-weight: 600; }
  .hint {
    font-size: 11px;
    color: #999;
    margin-top: 8px;
  }
  .hint code {
    background: #f5f5f5;
    padding: 1px 4px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <h1>Figma Copy — Page Order</h1>

  <div class="field">
    <label for="tokenInput">Personal Access Token</label>
    <div class="row">
      <input type="password" id="tokenInput" placeholder="figd_..." autocomplete="off" />
      <button id="saveTokenBtn" class="secondary">Сохранить</button>
    </div>
  </div>

  <div class="field conv">
    <label><input type="checkbox" id="scssEnabled" /> Конвертировать при копировании (<code>c t</code> / <code>c l</code> / <code>c s</code>)</label>
    <div id="scssProjectCurrent" class="proj-current">
      <div class="proj-label">Проект для замен</div>
      <div class="proj-name-row">
        <span id="scssProjectName" class="proj-name"></span>
        <button id="scssProjectClear" class="secondary" type="button">Без проекта</button>
      </div>
    </div>
    <input type="text" id="scssProjectSearch" placeholder="Поиск проекта, например serra idea" autocomplete="off" />
    <div id="scssProjectList" class="proj-list" hidden></div>
    <label class="inline"><input type="checkbox" id="scssToRem" /> px → rem (<code>--to-rem</code>)</label>
  </div>

  <button id="runBtn">Скопировать в порядке страницы</button>

  <div class="row" style="margin-top: 6px;">
    <button id="fontsBtn" class="secondary">Извлечь шрифты</button>
    <button id="colorsBtn" class="secondary">Извлечь цвета</button>
  </div>

  <div id="status"></div>

  <textarea id="output" readonly placeholder="Результат появится здесь..."></textarea>
  <button id="copyBtn" class="secondary" style="margin-top: 6px;" disabled>Скопировать</button>

  <div class="hint">
    В Figma выдели нужный фрейм/группу и нажми <code>Ctrl+Alt+L</code>
    (<code>⌘⌥L</code> на Mac) — «Copy link to selection». Потом жми кнопку выше.
  </div>

  <script src="popup.js"></script>
</body>
</html>
